pre-commit:
    commands:
        ultracite:
            run: |
                FILES=$(git diff --name-only --cached --diff-filter=ACMR)

                if [ -z "$FILES" ]; then
                  exit 0
                fi

                FORMATTABLE_FILES=$(echo "$FILES" | grep -E '\.(ts|tsx|mts|cts|js|jsx|mjs|cjs|json|jsonc|css)$' || true)

                if [ -n "$FORMATTABLE_FILES" ]; then
                  echo "$FORMATTABLE_FILES" | xargs env NODE_OPTIONS=--import=tsx bunx --no-install oxfmt --config oxfmt.config.ts --write
                  echo "$FORMATTABLE_FILES" | xargs env NODE_OPTIONS=--import=tsx bunx --no-install oxlint --config oxlint.config.ts --fix
                fi

                git add $FILES

commit-msg:
    commands:
        commitlint:
            run: bunx --no-install commitlint --edit {1}

pre-push:
    parallel: true
    commands:
        lint:
            run: bun run check:lint
        types:
            run: bun run check:types
        test:
            run: bun run test
