name: CI

on:
    pull_request:
    push:
        branches:
            - main

concurrency:
    group: ci-${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

permissions:
    contents: read

jobs:
    quality:
        name: Quality
        runs-on: ubuntu-latest

        steps:
            - name: Checkout
              uses: actions/checkout@v5

            - name: Setup Bun
              uses: oven-sh/setup-bun@v2
              with:
                  bun-version: latest

            - name: Install dependencies
              run: bun install --frozen-lockfile

            - name: Typecheck
              run: bun run check:types

            - name: Lint
              run: bun run check:lint

            - name: Test
              run: bun run test

    databases:
        name: Database suites
        runs-on: ubuntu-latest

        services:
            postgres:
                image: postgres:16-alpine
                env:
                    POSTGRES_DB: better_drizzle
                    POSTGRES_USER: postgres
                    POSTGRES_PASSWORD: postgres
                ports:
                    - 5432:5432
                options: >-
                    --health-cmd "pg_isready -U postgres -d better_drizzle" --health-interval 5s --health-timeout 3s --health-retries 10

            mysql:
                image: mysql:8
                env:
                    MYSQL_DATABASE: better_drizzle
                    MYSQL_ROOT_PASSWORD: mysql
                ports:
                    - 3306:3306
                options: >-
                    --health-cmd "mysqladmin ping -uroot -pmysql --silent" --health-interval 5s --health-timeout 3s --health-retries 20

            redis:
                image: redis:7-alpine
                ports:
                    - 6379:6379
                options: >-
                    --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 10

        env:
            DATABASE_URL: postgresql://postgres:postgres@localhost:5432/better_drizzle
            MYSQL_URL: mysql://root:mysql@localhost:3306/better_drizzle
            REDIS_URL: redis://localhost:6379

        steps:
            - name: Checkout
              uses: actions/checkout@v5

            - name: Setup Bun
              uses: oven-sh/setup-bun@v2
              with:
                  bun-version: latest

            - name: Install dependencies
              run: bun install --frozen-lockfile

            - name: Test PostgreSQL, MySQL, and Redis suites
              run: bun run test:databases

    package:
        name: Package validation
        runs-on: ubuntu-latest
        needs: [quality, databases]

        steps:
            - name: Checkout
              uses: actions/checkout@v5

            - name: Setup Bun
              uses: oven-sh/setup-bun@v2
              with:
                  bun-version: latest

            - name: Setup Node
              uses: actions/setup-node@v6
              with:
                  node-version: 24
                  registry-url: https://registry.npmjs.org

            - name: Install dependencies
              run: bun install --frozen-lockfile

            - name: Validate package tarball
              run: bun run pack
