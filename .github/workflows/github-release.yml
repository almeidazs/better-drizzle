name: GitHub Release

on:
    push:
        tags:
            - v*
    workflow_dispatch:
        inputs:
            tag:
                description: Existing tag to build and attach (e.g. v0.3.0)
                required: true

concurrency:
    group: github-release-${{ github.event.inputs.tag || github.ref_name }}
    cancel-in-progress: false

permissions:
    contents: write

jobs:
    release:
        name: Pack and attach tarball
        runs-on: ubuntu-latest

        env:
            TAG: ${{ github.event.inputs.tag || github.ref_name }}
            GH_TOKEN: ${{ github.token }}

        steps:
            - name: Checkout
              uses: actions/checkout@v5
              with:
                  ref: ${{ env.TAG }}

            - name: Setup Bun
              uses: oven-sh/setup-bun@v2
              with:
                  bun-version: latest

            - name: Setup Node
              uses: actions/setup-node@v6
              with:
                  node-version: 24

            - name: Validate tag matches package.json
              shell: bash
              run: |
                  version="$(node -p "require('./package.json').version")"
                  if [[ "$TAG" != "v$version" ]]; then
                    echo "::error::Tag $TAG does not match package.json version $version"
                    exit 1
                  fi

            - name: Install dependencies
              run: bun install --frozen-lockfile

            - name: Typecheck
              run: bun run check:types

            - name: Test
              run: bun run test

            - name: Build
              run: bun run build

            - name: Pack
              id: pack
              shell: bash
              run: |
                  file="$(npm pack --ignore-scripts --silent)"
                  echo "file=$file" >> "$GITHUB_OUTPUT"

            - name: Create or update release
              shell: bash
              run: |
                  file="${{ steps.pack.outputs.file }}"
                  prerelease=""
                  [[ "$TAG" == *-* ]] && prerelease="--prerelease"

                  if gh release view "$TAG" >/dev/null 2>&1; then
                    gh release upload "$TAG" "$file" --clobber
                  else
                    gh release create "$TAG" "$file" --title "$TAG" --generate-notes $prerelease
                  fi

                  url="https://github.com/${{ github.repository }}/releases/download/$TAG/$file"
                  {
                    echo "Attached \`$file\` to \`$TAG\`"
                    echo ""
                    echo '```bash'
                    echo "bun add $url"
                    echo '```'
                  } >> "$GITHUB_STEP_SUMMARY"
