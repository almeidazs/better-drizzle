name: Release

on:
    release:
        types:
            - published

permissions:
    contents: read
    id-token: write

jobs:
    ci:
        name: CI
        uses: ./.github/workflows/ci.yml

    publish:
        name: Publish package to npm
        needs: ci
        runs-on: ubuntu-latest
        environment: npm

        steps:
            - name: Checkout
              uses: actions/checkout@v7

            - name: Setup Bun
              uses: oven-sh/setup-bun@v2
              with:
                  bun-version-file: .bun-version

            - name: Setup Node
              uses: actions/setup-node@v7
              with:
                  node-version: 24
                  registry-url: https://registry.npmjs.org

            # Trusted publishing (OIDC) needs npm >= 11.5.1.
            - name: Update npm
              run: npm install -g npm@11

            - name: Validate release version
              id: release
              shell: bash
              run: |
                  tag="${{ github.event.release.tag_name }}"
                  is_prerelease="${{ github.event.release.prerelease }}"

                  case "$tag" in
                    v*)
                      version="${tag#v}"
                      ;;
                    *)
                      echo "::error::Unsupported release tag: $tag"
                      echo "::error::Use the format vX.Y.Z"
                      exit 1
                      ;;
                  esac

                  dist_tag="latest"
                  if [[ "$is_prerelease" == "true" ]]; then
                    dist_tag="next"
                  fi

                  {
                    echo "tag=$tag"
                    echo "version=$version"
                    echo "dist_tag=$dist_tag"
                  } >> "$GITHUB_OUTPUT"

            - name: Install dependencies
              run: bun install --frozen-lockfile

            - name: Validate package metadata
              shell: bash
              run: |
                  release_version="${{ steps.release.outputs.version }}"
                  package_version="$(node -p "require('./package.json').version")"
                  package_name="$(node -p "require('./package.json').name")"

                  if [[ "$package_name" != "better-drizzle" ]]; then
                    echo "::error::Package name must be better-drizzle, found $package_name"
                    exit 1
                  fi

                  if [[ "$package_version" != "$release_version" ]]; then
                    echo "::error::Release tag version $release_version does not match package.json version $package_version"
                    exit 1
                  fi

            - name: Check if version is already published
              id: published
              shell: bash
              run: |
                  package_name="$(node -p "require('./package.json').name")"
                  version="${{ steps.release.outputs.version }}"

                  if npm view "${package_name}@${version}" version >/dev/null 2>&1; then
                    echo "already_published=true" >> "$GITHUB_OUTPUT"
                    echo "Package ${package_name}@${version} is already published." >> "$GITHUB_STEP_SUMMARY"
                    exit 0
                  fi

                  echo "already_published=false" >> "$GITHUB_OUTPUT"

            - name: Run quality checks
              if: steps.published.outputs.already_published != 'true'
              run: bun run check

            - name: Publish to npm
              if: steps.published.outputs.already_published != 'true'
              shell: bash
              run: |
                  version="${{ steps.release.outputs.version }}"
                  dist_tag="${{ steps.release.outputs.dist_tag }}"

                  npm publish --access public --tag "$dist_tag"

                  {
                    echo "Published \`better-drizzle@${version}\`"
                    echo ""
                    echo "- npm dist-tag: \`${dist_tag}\`"
                    echo "- release tag: \`${{ steps.release.outputs.tag }}\`"
                  } >> "$GITHUB_STEP_SUMMARY"
